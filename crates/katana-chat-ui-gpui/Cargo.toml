[package]
name = "katana-chat-ui-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "GPUI adapter for the standard katana-chat-ui surface."

[lib]
path = "src/lib.rs"

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
image = { version = "0.25.10", default-features = false }
katana-chat-ui = { path = "../katana-chat-ui", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
# xattr 0.2.3 は libc 0.2.190 以降で削除された Linux ENOATTR を参照する。
libc = "=0.2.189"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
