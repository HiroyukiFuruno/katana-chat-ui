name: Release

on:
  pull_request:
    types: [closed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example v0.1.0. Defaults to Cargo.toml version."
        required: false
        type: string
      verify_registry_auth:
        description: "Read-only check that the dedicated and legacy registry Secret names resolve to the same credential."
        required: false
        default: false
        type: boolean
      verify_native_ime:
        description: "Run real Japanese IME acceptance on an isolated macOS runner without publishing."
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  release-admission:
    if: >
      inputs.verify_registry_auth != true && inputs.verify_native_ime != true && (
        github.event_name == 'workflow_dispatch' || (
          github.event.pull_request.merged == true &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'release/v')
        )
      )
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.admission.outputs.source_sha }}
      version: ${{ steps.admission.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - name: Admit release source
        id: admission
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          RELEASE_PR_MERGED: ${{ github.event.pull_request.merged }}
          RELEASE_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          RELEASE_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          RELEASE_PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: bash scripts/release/verify-release-source.sh

  verify-native-ime-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_native_ime == true
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Compile isolated runner probe
        run: |
          mkdir -p "$RUNNER_TEMP/kcu-ime"
          swiftc scripts/manual-ui/ime/macos-ocr.swift scripts/manual-ui/ime/test-macos-ocr.swift -o "$RUNNER_TEMP/kcu-ime/ocr-tests"
          "$RUNNER_TEMP/kcu-ime/ocr-tests" --result="$RUNNER_TEMP/kcu-ime/ocr-test-result.json"
          swiftc scripts/manual-ui/ime/macos-ime-state.swift scripts/manual-ui/ime/test-macos-ime-state.swift -o "$RUNNER_TEMP/kcu-ime/commit-observer-tests"
          "$RUNNER_TEMP/kcu-ime/commit-observer-tests" --result="$RUNNER_TEMP/kcu-ime/commit-observer-test-result.json"
          swiftc scripts/manual-ui/ime/macos-ocr.swift scripts/manual-ui/ime/macos-probe.swift -o "$RUNNER_TEMP/kcu-ime/probe"
      - name: Check runner permissions before building
        run: '"$RUNNER_TEMP/kcu-ime/probe" --preflight "$RUNNER_TEMP/kcu-ime/preflight.json"'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build actual native hosts
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          for host in egui floem gpui; do
            cargo build --locked --manifest-path "tools/manual-host-$host/Cargo.toml"
          done
          swiftc -parse-as-library scripts/manual-ui/ime/macos-ime-state.swift scripts/manual-ui/ime/macos-reference.swift -o "$GITHUB_WORKSPACE/target/debug/manual-host-appkit"
      - name: Exercise real Japanese IME in each host
        run: |
          failed=0
          for host in egui floem gpui appkit; do
            "$RUNNER_TEMP/kcu-ime/probe" --binary "$GITHUB_WORKSPACE/target/debug/manual-host-$host" --artifacts "$RUNNER_TEMP/kcu-ime/$host" --host "$host" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-ime-macos-${{ github.sha }}
          path: ${{ runner.temp }}/kcu-ime
          if-no-files-found: error

  verify-registry-auth:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_registry_auth == true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Compare registry credential names
        env:
          NEW_TOKEN: ${{ secrets.KCU_CARGO_REGISTRY_TOKEN }}
          OLD_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          python3 - <<'PY'
          import hmac
          import os
          import sys

          new_token = os.environ.get("NEW_TOKEN", "")
          old_token = os.environ.get("OLD_TOKEN", "")
          if not new_token or not old_token:
              print("Both registry credentials must be present.", file=sys.stderr)
              raise SystemExit(1)
          if not hmac.compare_digest(new_token, old_token):
              print("Registry credential names resolve to different values.", file=sys.stderr)
              raise SystemExit(1)
          print("Registry credential names resolve to the same non-empty value.")
          PY

  release-verify-macos:
    needs: release-admission
    if: needs.release-admission.result == 'success'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-admission.outputs.source_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run macOS release verification
        env:
          RELEASE_VERSION: ${{ needs.release-admission.outputs.version }}
        run: just VERSION="${RELEASE_VERSION}" release-verify-macos

  release-verify-native-linux-aarch64:
    needs: release-admission
    if: needs.release-admission.result == 'success'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-admission.outputs.source_sha }}
          fetch-depth: 0
      - uses: taiki-e/install-action@just
      - name: Run native Linux release verification
        env:
          RELEASE_VERSION: ${{ needs.release-admission.outputs.version }}
        run: just VERSION="${RELEASE_VERSION}" release-verify-native-linux-aarch64

  release:
    needs: [release-admission, release-verify-macos, release-verify-native-linux-aarch64]
    if: needs.release-admission.result == 'success' && needs.release-verify-macos.result == 'success' && needs.release-verify-native-linux-aarch64.result == 'success'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-admission.outputs.source_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Create release tag
        env:
          TAG: ${{ needs.release-admission.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            if [[ "$(git rev-parse "${TAG}^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag ${TAG} belongs to a different commit; refusing mixed-source publication." >&2
              exit 1
            fi
            echo "Tag ${TAG} matches the release source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"
      - name: Publish crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.KCU_CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ needs.release-admission.outputs.version }}
        run: bash scripts/release/publish-crates.sh "${RELEASE_VERSION}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-admission.outputs.version }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --latest --verify-tag
          else
            gh release create "${TAG}" --verify-tag --latest --generate-notes
          fi
