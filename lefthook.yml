# lefthook.yml
no_tty: true
output:
  - failure

pre-commit:
  parallel: false
  commands:
    fmt-check:
      run: just fmt-check
    lint:
      run: just lint
    ast-lint:
      run: just ast-lint

pre-push:
  parallel: false
  commands:
    issue-driven-release-verify:
      use_stdin: true
      run: python3 scripts/hooks/dispatch.py

commit-msg:
  commands:
    issue-reference:
      run: python3 scripts/hooks/issue_gate.py commit-msg "{1}"

pre-pr:
  commands:
    release-verify:
      run: just release-verify
