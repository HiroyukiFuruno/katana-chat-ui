[workspace]
members = [
    "crates/katana-acp-client",
    "crates/katana-chat-ui",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/HiroyukiFuruno/katana-chat-ui"
rust-version = "1.95.0"
authors = ["Hiroyuki Furuno"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "sync"] }
async-trait = "0.1"
egui = "0.34"
