[package]
name = "kcu-host-support"
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[workspace]

[dependencies]
katana-chat-ui = { path = "../../crates/katana-chat-ui" }
katana-acp-client = { path = "../../crates/katana-acp-client" }
agent-client-protocol = "3.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt", "sync", "time"] }
