[package]
name = "manual-host-floem"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
ime-vello-reference = ["floem/vello"]

[dependencies]
floem = { version = "0.2.0", features = ["rfd-async-std", "vger"] }
katana-acp-client = { path = "../../crates/katana-acp-client" }
katana-chat-ui = { path = "../../crates/katana-chat-ui" }
katana-chat-ui-floem = { path = "../../crates/katana-chat-ui-floem" }
kcu-host-support = { path = "../host-support" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["net", "rt", "time"] }
toml = "1.1"

[dev-dependencies]
tempfile = "3"
