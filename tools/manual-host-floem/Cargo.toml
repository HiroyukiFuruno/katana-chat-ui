[package]
name = "manual-host-floem"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
floem = { git = "https://github.com/lapce/floem", rev = "f2ce49556606db6d8f025443f834f04b7a6b4796", features = ["rfd-async-std"] }
katana-acp-client = { path = "../../crates/katana-acp-client" }
katana-chat-ui = { path = "../../crates/katana-chat-ui" }
katana-chat-ui-floem = { path = "../../crates/katana-chat-ui-floem" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["net", "rt", "time"] }
toml = "1.1"
