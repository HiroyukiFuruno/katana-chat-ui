[package]
name = "manual-host-floem"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
crossbeam-channel = "0.5"
floem = { version = "0.2.0", features = ["rfd-async-std"] }
katana-acp-client = { path = "../../crates/katana-acp-client" }
katana-chat-ui = { path = "../../crates/katana-chat-ui" }
katana-chat-ui-floem = { path = "../../crates/katana-chat-ui-floem" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.2", features = ["net", "rt", "time"] }
toml = "1.1"
